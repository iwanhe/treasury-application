name: CI
permissions:
  contents: write
on:
  push:
    branches: [main, feature/vercel-hobby-poc]
  pull_request:
    branches: [main]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: treasury
          POSTGRES_PASSWORD: treasury_dev
          POSTGRES_DB: treasury
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U treasury -d treasury"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://treasury:treasury_dev@localhost:5432/treasury?schema=public
      DIRECT_URL: postgresql://treasury:treasury_dev@localhost:5432/treasury?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and generate lockfile
        run: |
          pnpm install --no-frozen-lockfile
          if [ ! -f pnpm-lock.yaml ]; then pnpm install --lockfile-only; fi
      - name: Commit generated pnpm lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/vercel-hobby-poc'
        run: |
          if [ -f pnpm-lock.yaml ] && ! git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "build: commit pnpm lockfile"
            git push
          fi
      - run: pnpm --filter @treasury/api prisma:validate
      - run: pnpm --filter @treasury/api prisma:generate
      - name: Apply database migrations
        run: pnpm --filter @treasury/api prisma:deploy
      - run: pnpm --filter @treasury/api test
      - run: pnpm --filter @treasury/api build
      - name: Type-check demo seed
        run: pnpm --filter @treasury/api check:seed
      - run: pnpm --filter @treasury/web build
      - name: Run frontend unit tests
        run: pnpm --filter @treasury/web test
      - name: Validate Keycloak realm JSON
        run: python -m json.tool docker/keycloak/treasury-dev-realm.json > /dev/null
      - name: Seed disposable demo database
        run: pnpm --filter @treasury/api prisma:seed
      - name: Start imported Keycloak demo realm
        run: |
          docker run -d --name treasury-keycloak -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "$GITHUB_WORKSPACE/docker/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.3 start-dev --import-realm
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:8080/realms/treasury-dev/.well-known/openid-configuration >/dev/null; then
              echo "Keycloak realm is ready"; break
            fi
            if [ "$attempt" -eq 90 ]; then docker logs treasury-keycloak; exit 1; fi
            sleep 5
          done
      - name: Verify deterministic demo identities in Keycloak
        run: |
          TOKEN=$(curl -fsS -X POST http://localhost:8080/realms/master/protocol/openid-connect/token \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'client_id=admin-cli' \
            --data-urlencode 'username=admin' \
            --data-urlencode 'password=admin' \
            --data-urlencode 'grant_type=password' | jq -r '.access_token')
          test -n "$TOKEN" && test "$TOKEN" != "null"
          for pair in \
            'treasury.admin:d1111111-1111-4111-8111-111111111111' \
            'treasury.maker:d2222222-2222-4222-8222-222222222222' \
            'treasury.checker:d3333333-3333-4333-8333-333333333333'; do
            USERNAME="${pair%%:*}"
            EXPECTED_ID="${pair#*:}"
            ACTUAL_ID=$(curl -fsS -H "Authorization: Bearer $TOKEN" \
              "http://localhost:8080/admin/realms/treasury-dev/users?username=$USERNAME&exact=true" | jq -r '.[0].id // empty')
            test "$ACTUAL_ID" = "$EXPECTED_ID" || { echo "Unexpected Keycloak subject for $USERNAME: $ACTUAL_ID"; exit 1; }
          done
      - name: Set deterministic E2E passwords
        run: |
          TOKEN=$(curl -fsS -X POST http://localhost:8080/realms/master/protocol/openid-connect/token \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'client_id=admin-cli' \
            --data-urlencode 'username=admin' \
            --data-urlencode 'password=admin' \
            --data-urlencode 'grant_type=password' | jq -r '.access_token')
          for USER_ID in \
            d1111111-1111-4111-8111-111111111111 \
            d2222222-2222-4222-8222-222222222222 \
            d3333333-3333-4333-8333-333333333333; do
            curl -fsS -X PUT "http://localhost:8080/admin/realms/treasury-dev/users/$USER_ID/reset-password" \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' \
              -d '{"type":"password","value":"ChangeMe123!","temporary":false}'
          done
      - name: Start API and web for browser tests
        env:
          NODE_ENV: test
          API_PORT: 3000
          WEB_ORIGIN: http://localhost:5173
          OIDC_ISSUER: http://localhost:8080/realms/treasury-dev
          OIDC_AUDIENCE: treasury-api
          OIDC_JWKS_URI: http://localhost:8080/realms/treasury-dev/protocol/openid-connect/certs
          VITE_API_BASE_URL: http://localhost:3000/api
          VITE_OIDC_URL: http://localhost:8080
          VITE_OIDC_REALM: treasury-dev
          VITE_OIDC_CLIENT_ID: treasury-web
        run: |
          pnpm --filter @treasury/api start:prod > /tmp/treasury-api.log 2>&1 &
          pnpm --filter @treasury/web dev -- --host 127.0.0.1 > /tmp/treasury-web.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health >/dev/null && curl -fsS http://localhost:5173 >/dev/null; then
              echo "API and web are ready"; exit 0
            fi
            sleep 2
          done
          cat /tmp/treasury-api.log
          cat /tmp/treasury-web.log
          exit 1
      - name: Install Playwright Chromium
        run: pnpm --filter @treasury/web exec playwright install --with-deps chromium
      - name: Run Playwright browser E2E
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:5173
        run: pnpm --filter @treasury/web test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
      - name: Validate Docker Compose
        run: docker compose config --quiet
